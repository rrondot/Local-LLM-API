replicaCount: 1

api:
  image:
    repository: rrondot/llm-api
    tag: "latest"
  
  service:
    type: NodePort
    port: 80
    targetPort: 8000
    nodePort: 30000
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  env:
    DEFAULT_MODEL: "llama3.1:8b"

ollama:
  image:
    repository: ollama/ollama
    pullPolicy: IfNotPresent
    tag: "latest"
  
  service:
    type: ClusterIP
    port: 11434
    targetPort: 11434
  
  resources:
    limits:
      cpu: 2000m
      memory: 6Gi
    requests:
      cpu: 1000m
      memory: 4Gi
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi

modelInit:
  enabled: true
  model: "llama3.1:8b"


prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.48.0
    pullPolicy: IfNotPresent
  
  service:
    type: NodePort
    port: 9090
    targetPort: 9090
    nodePort: 30090
  
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  
  retention: 15d
  scrapeInterval: 15s
  evaluationInterval: 15s


grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: 10.2.2
    pullPolicy: IfNotPresent
  
  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30030
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi

  
  datasources:
    - name: Prometheus
      type: prometheus
      url: http://{{ include "llm-api.fullname" . }}-prometheus:9090
      access: proxy
      isDefault: true

serviceAccount:
  create: true
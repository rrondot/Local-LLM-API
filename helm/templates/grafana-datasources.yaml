{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-api.fullname" . }}-grafana-datasources
  labels:
    {{- include "llm-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "llm-api.fullname" . }}-prometheus:{{ .Values.prometheus.service.port }}
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s
{{- end }}